<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SAIDI - Periodo > Localizacion</title>
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
  <style>
    :root {
      color-scheme: light;
      --bg: #f7f8fb;
      --panel: #ffffff;
      --ink: #1f2937;
      --muted: #5d6678;
      --line: #d9dee8;
      --i: #2563eb;
      --p: #e11d48;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--ink);
    }
    header {
      padding: 18px 24px 10px;
      border-bottom: 1px solid var(--line);
      background: var(--panel);
    }
    h1 {
      margin: 0 0 8px;
      font-size: 22px;
      line-height: 1.25;
      letter-spacing: 0;
    }
    .bar {
      display: flex;
      gap: 10px;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
    }
    #breadcrumb {
      color: var(--muted);
      font-size: 14px;
    }
    button {
      border: 1px solid var(--line);
      background: #fff;
      color: var(--ink);
      border-radius: 6px;
      padding: 8px 11px;
      cursor: pointer;
      font-size: 14px;
    }
    button:disabled {
      color: #a4acbb;
      cursor: default;
      background: #f4f6fa;
    }
    main {
      min-height: calc(100vh - 91px);
      padding: 12px;
    }
    #chart {
      width: 100%;
      height: calc(100vh - 120px);
      min-height: 620px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <header>
    <h1 id="title"></h1>
    <div class="bar">
      <div id="breadcrumb"></div>
      <button id="backButton" type="button" disabled>Volver</button>
    </div>
  </header>
  <main>
    <div id="chart"></div>
  </main>

  <script>
    const payload = {"title": "SAIDI - Periodo > Localizacion", "valueName": "SAIDI", "levelNames": ["Periodo", "Localizacion"], "data": {"root": [{"label": "S1-2024", "I": 1.119565828959149, "P": 1.3541653003400713, "total": 2.47373112929922}, {"label": "S1-2025", "I": 1.3680437706580708, "P": 1.427449, "total": 2.795492770658071}, {"label": "S1-2026", "I": 1.35701497687945, "P": 0.89219, "total": 2.24920497687945}], "children": {"S1-2024": [{"label": "Programada", "I": 0.0, "P": 1.3541653003400713, "total": 1.3541653003400713}, {"label": "No determinado", "I": 0.3707720930448214, "P": 0.0, "total": 0.3707720930448214}, {"label": "Red Subterránea MT", "I": 0.3126698558969786, "P": 0.0, "total": 0.3126698558969786}, {"label": "Red Aérea MT", "I": 0.22021903820139174, "P": 0.0, "total": 0.22021903820139174}, {"label": "Subestación Convencional MTBT", "I": 0.04853944260811278, "P": 0.0, "total": 0.04853944260811278}, {"label": "Instalaciones Particulares MT", "I": 0.04846741056636997, "P": 0.0, "total": 0.04846741056636997}, {"label": "Varios", "I": 0.04439133981741224, "P": 0.0, "total": 0.04439133981741224}, {"label": "Subestación Aérea MTBT", "I": 0.03212872142077063, "P": 0.0, "total": 0.03212872142077063}, {"label": "PDS/PDF", "I": 0.013760454648180112, "P": 0.0, "total": 0.013760454648180112}, {"label": "Subestación Compacta MTBT", "I": 0.011471115121752765, "P": 0.0, "total": 0.011471115121752765}, {"label": "Maniobras sin tensión", "I": 0.010969983177946218, "P": 0.0, "total": 0.010969983177946218}, {"label": "Transformador MTBT", "I": 0.006176374455412569, "P": 0.0, "total": 0.006176374455412569}], "S1-2025": [{"label": "Programada", "I": 0.0, "P": 1.427449, "total": 1.427449}, {"label": "No determinado", "I": 0.418113, "P": 0.0, "total": 0.418113}, {"label": "Red Aérea MT", "I": 0.4043000527115549, "P": 0.0, "total": 0.4043000527115549}, {"label": "Red Subterránea MT", "I": 0.26733796853696606, "P": 0.0, "total": 0.26733796853696606}, {"label": "Subestación Aérea MTBT", "I": 0.06494431574613818, "P": 0.0, "total": 0.06494431574613818}, {"label": "Varios", "I": 0.05383647388824983, "P": 0.0, "total": 0.05383647388824983}, {"label": "PDS/PDF", "I": 0.04351884272708202, "P": 0.0, "total": 0.04351884272708202}, {"label": "Subestación Convencional MTBT", "I": 0.03031339458771819, "P": 0.0, "total": 0.03031339458771819}, {"label": "Instalaciones Particulares MT", "I": 0.02776172246036162, "P": 0.0, "total": 0.02776172246036162}, {"label": "Maniobras sin tensión", "I": 0.02093, "P": 0.0, "total": 0.02093}, {"label": "Subestación Compacta MTBT", "I": 0.016684, "P": 0.0, "total": 0.016684}, {"label": "Red Aérea AT", "I": 0.01142, "P": 0.0, "total": 0.01142}, {"label": "Interruptor Potencia Aéreo MT", "I": 0.003542, "P": 0.0, "total": 0.003542}, {"label": "Seccionador de Potencia MT", "I": 0.0032649999999999997, "P": 0.0, "total": 0.0032649999999999997}, {"label": "Transformador MTBT", "I": 0.001095, "P": 0.0, "total": 0.001095}, {"label": "Recloser", "I": 0.000981, "P": 0.0, "total": 0.000981}, {"label": "PMS", "I": 1e-06, "P": 0.0, "total": 1e-06}], "S1-2026": [{"label": "Programada", "I": 0.0, "P": 0.89219, "total": 0.89219}, {"label": "Red Subterránea MT", "I": 0.47032706562655596, "P": 0.0, "total": 0.47032706562655596}, {"label": "No determinado", "I": 0.337007, "P": 0.0, "total": 0.337007}, {"label": "Red Aérea MT", "I": 0.215313730000306, "P": 0.0, "total": 0.215313730000306}, {"label": "Instalaciones Particulares MT", "I": 0.09188297187313844, "P": 0.0, "total": 0.09188297187313844}, {"label": "Subestación Convencional MTBT", "I": 0.072408, "P": 0.0, "total": 0.072408}, {"label": "PDS/PDF", "I": 0.03493309580754685, "P": 0.0, "total": 0.03493309580754685}, {"label": "Subestación Compacta MTBT", "I": 0.031809000000000004, "P": 0.0, "total": 0.031809000000000004}, {"label": "Subestación Aérea MTBT", "I": 0.018913, "P": 0.0, "total": 0.018913}, {"label": "Interruptor Potencia Aéreo MT", "I": 0.017742, "P": 0.0, "total": 0.017742}, {"label": "Varios", "I": 0.01667, "P": 0.0, "total": 0.01667}, {"label": "Recloser", "I": 0.013279113571902722, "P": 0.0, "total": 0.013279113571902722}, {"label": "Transformador MTBT", "I": 0.012764000000000001, "P": 0.0, "total": 0.012764000000000001}, {"label": "Regulador de Tensión MT", "I": 0.012149, "P": 0.0, "total": 0.012149}, {"label": "Maniobras sin tensión", "I": 0.010920000000000001, "P": 0.0, "total": 0.010920000000000001}, {"label": "Seccionador de Potencia MT", "I": 0.000366, "P": 0.0, "total": 0.000366}, {"label": "Seccionador de Potencia Aéreo MT", "I": 0.00033, "P": 0.0, "total": 0.00033}, {"label": "Subestación compacta MTBT", "I": 0.000201, "P": 0.0, "total": 0.000201}]}}};
    const stack = [{ key: "root", level: 0, label: "Inicio" }];
    const colors = { I: "#2563eb", P: "#e11d48" };

    function current() {
      return stack[stack.length - 1];
    }

    function nextKey(pointLabel) {
      const labels = stack.slice(1).map(item => item.label).concat([pointLabel]);
      return labels.join("||");
    }

    function chartTitle() {
      const node = current();
      const levelName = payload.levelNames[node.level] || "";
      return `${payload.title} - ${levelName}`;
    }

    function updateChrome() {
      document.getElementById("title").textContent = chartTitle();
      document.getElementById("breadcrumb").textContent = stack.map(item => item.label).join(" > ");
      document.getElementById("backButton").disabled = stack.length === 1;
    }

    function render() {
      const node = current();
      const rows = payload.data.children[node.key] || payload.data[node.key] || [];
      const labels = rows.map(row => row.label);
      const chartTotal = rows.reduce((total, row) => total + Number(row.total || 0), 0);
      const barPercent = (row, tipo) => {
        const value = Number(row[tipo] || 0);
        const total = Number(row.total || 0);
        return total > 0 ? (value / total) * 100 : 0;
      };
      const hierarchyPercent = row => {
        const total = Number(row.total || 0);
        return chartTotal > 0 ? (total / chartTotal) * 100 : 0;
      };
      const percentText = (row, tipo) => {
        const percent = barPercent(row, tipo);
        const displayPercent = percent >= 99.999 ? hierarchyPercent(row) : percent;
        return `${displayPercent.toFixed(1)}%`;
      };
      const percentDescription = (row, tipo) =>
        barPercent(row, tipo) >= 99.999 ? "Porcentaje de la jerarquia: " : "Porcentaje de la barra: ";

      const traces = ["I", "P"].map(tipo => ({
        type: "funnel",
        name: tipo,
        y: labels,
        x: rows.map(row => row[tipo] || 0),
        customdata: rows.map(row => {
          const percentLabel = percentText(row, tipo);
          const hoverPercent = percentDescription(row, tipo) + percentLabel + "<br>";
          return [row.label, percentLabel, row.total || 0, hoverPercent];
        }),
        text: rows.map(row => {
          const value = Number(row[tipo] || 0);
          const label = percentText(row, tipo);
          return `${value.toFixed(6)}<br>${label}`;
        }),
        textinfo: "text",
        hovertemplate:
          "<b>%{customdata[0]}</b><br>" +
          "Tipo: " + tipo + "<br>" +
          payload.valueName + ": %{x:.6f}<br>" +
          "%{customdata[3]}" +
          "Total barra: %{customdata[2]:.6f}<extra></extra>",
        marker: { color: colors[tipo] },
        connector: { line: { color: "#cbd5e1", width: 1 } }
      }));

      const layout = {
        title: { text: chartTitle(), x: 0.02, xanchor: "left" },
        funnelmode: "stack",
        margin: { l: 170, r: 40, t: 58, b: 40 },
        paper_bgcolor: "#ffffff",
        plot_bgcolor: "#ffffff",
        legend: { orientation: "h", y: 1.06, x: 1, xanchor: "right" },
        font: { family: "Arial, Helvetica, sans-serif", size: 13, color: "#1f2937" }
      };

      Plotly.react("chart", traces, layout, { responsive: true, displaylogo: false });
      updateChrome();

      const chart = document.getElementById("chart");
      chart.removeAllListeners && chart.removeAllListeners("plotly_click");
      chart.on("plotly_click", event => {
        const point = event.points && event.points[0];
        if (!point) return;
        if (node.level >= payload.levelNames.length - 1) return;
        const label = Array.isArray(point.customdata) ? point.customdata[0] : point.y;
        const key = nextKey(label);
        if (!payload.data.children[key]) return;
        stack.push({ key, level: node.level + 1, label });
        render();
      });
    }

    document.getElementById("backButton").addEventListener("click", () => {
      if (stack.length > 1) {
        stack.pop();
        render();
      }
    });

    render();
  </script>
</body>
</html>
